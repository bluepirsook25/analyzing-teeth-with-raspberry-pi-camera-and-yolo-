<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dental PC – Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #888; margin-bottom: 28px; }
    label { display: block; text-align: left; font-size: 13px; color: #555; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #2196f3; }
    button {
      width: 100%;
      padding: 13px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1769aa; }
    .error {
      background: #fdecea;
      color: #c62828;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .hint { font-size: 11px; color: #aaa; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🦷</div>
    <h1>Dental PC Portal</h1>
    <p class="sub">Login to book your appointment</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="user" required />

      <label for="password">Date of Birth (DDMMYYYY)</label>
      <input id="password" name="password" type="password" placeholder="e.g. 01011990" required />

      <button type="submit">Login →</button>
    </form>
    <p class="hint">Username: <b>user</b> &nbsp;|&nbsp; Password: your date of birth</p>
  </div>
</body>
</html>
