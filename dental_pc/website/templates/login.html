@'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Dental PC Login</title>
  <style>
    body{font-family:sans-serif;background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .card{background:#fff;border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    h1{font-size:22px;margin-bottom:6px;color:#1a1a2e}.sub{color:#888;font-size:13px;margin-bottom:28px}
    label{display:block;text-align:left;font-size:13px;color:#555;margin-bottom:4px}
    input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:18px;box-sizing:border-box}
    button{width:100%;padding:13px;background:#2196f3;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
    button:hover{background:#1769aa}.error{background:#fdecea;color:#c62828;padding:10px;border-radius:8px;margin-bottom:18px;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:48px">🦷</div>
    <h1>Dental PC Portal</h1>
    <p class="sub">Login to book your appointment</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input name="username" type="text" placeholder="user" required/>
      <label>Date of Birth (DDMMYYYY)</label>
      <input name="password" type="password" placeholder="e.g. 01011990" required/>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
'@ | Out-File -FilePath website\templates\login.html -Encoding utf8
